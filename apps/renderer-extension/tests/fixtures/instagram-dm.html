<!doctype html>
<html lang="th">
<head><meta charset="utf-8"><title>Instagram DM regression fixture</title></head>
<body data-site-fixture="instagram-dm">
  <nav aria-label="รายการแชท">
    <div role="button" data-conversation-id="alpha"><span data-preview>ข้อความล่าสุด 🫯</span></div>
  </nav>
  <main aria-label="ห้องสนทนา">
    <div role="row" data-message-id="sent"><span>ส่งเอง 👩🏽‍💻</span></div>
    <div role="row" data-message-id="received"><span>ได้รับ ไทย 🫩 English ❤️ 👌🏻 1️⃣ 🇹🇭</span></div>
    <div role="row" data-message-id="emoji-only"><span>🫯</span></div>
    <div role="row" data-message-id="tag-flag"><span>🏴󠁧󠁢󠁥󠁮󠁧󠁿</span></div>
    <div data-history aria-label="ประวัติย้อนหลัง"></div>
  </main>
  <div role="textbox" aria-label="ส่งข้อความ" contenteditable="true">กำลังพิมพ์ภาษาไทย 🫯</div>
</body>
</html>

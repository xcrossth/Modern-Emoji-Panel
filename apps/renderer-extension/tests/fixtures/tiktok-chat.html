<!doctype html>
<html lang="th">
<head><meta charset="utf-8"><title>TikTok Chat regression fixture</title></head>
<body data-site-fixture="tiktok-chat">
  <aside data-e2e="chat-list">
    <div data-e2e="chat-list-item"><span data-e2e="chat-preview">ข้อความล่าสุด 🫯</span></div>
  </aside>
  <main data-e2e="chat-room">
    <div data-e2e="chat-item-sent"><span>ส่งเอง 👩🏽‍💻</span></div>
    <div data-e2e="chat-item-received"><span>ได้รับ ไทย 🫩 English ❤️ 👌🏻 1️⃣ 🇹🇭</span></div>
    <div data-e2e="chat-item-emoji-only"><span>🫯</span></div>
    <div data-e2e="chat-item-tag-flag"><span>🏴󠁧󠁢󠁥󠁮󠁧󠁿</span></div>
    <div data-e2e="chat-history"></div>
  </main>
  <div role="textbox" data-e2e="message-input" contenteditable="true">กำลังพิมพ์ภาษาไทย 🫯</div>
</body>
</html>

<!doctype html>
<html lang="th">
<head><meta charset="utf-8"><title>Facebook Messenger regression fixture</title></head>
<body data-site-fixture="facebook-messenger">
  <main aria-label="ห้องสนทนา">
    <div role="row" data-message-id="bubble">
      <span>ข้อความใน bubble
        <img height="16" width="16" alt="😆" src="https://static.xx.fbcdn.net/images/emoji.php/v9/t4/1/16/1f606.png">
      </span>
    </div>
    <div role="button" aria-label="1 reaction with 🥰" data-message-id="reaction">
      <img height="16" width="16" alt="🥰" src="https://static.xx.fbcdn.net/images/emoji.php/v9/t91/1/16/1f970.png">
    </div>
    <div role="row" data-message-id="emoji-only">
      <img height="32" width="32" alt="🥰" src="https://static.xx.fbcdn.net/images/emoji.php/v9/t91/1/32/1f970.png">
    </div>
    <img data-profile-photo alt="รูปโปรไฟล์" src="https://scontent.fbkk.example/profile.jpg">
  </main>
  <div role="textbox" aria-label="ส่งข้อความ" contenteditable="true">กำลังพิมพ์
    <img id="composer-emoji" height="16" width="16" alt="😆" src="https://static.xx.fbcdn.net/images/emoji.php/v9/t4/1/16/1f606.png">
  </div>
</body>
</html>
